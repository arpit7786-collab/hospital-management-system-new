{% extends "base.html" %}{% block title %}Admin Login | CarePoint{% endblock %}
{% block content %}
<div class="login-card">
  <div class="logo">✚</div><h1>Welcome back</h1><p class="muted">Sign in to your hospital dashboard</p>
  <form method="post">
    <label>Username</label><input name="username" required placeholder="Enter username">
    <label>Password</label><input type="password" name="password" required placeholder="Enter password">
    <button class="btn full">Sign in</button>
  </form>
  <p class="hint">Demo: admin / Admin@123</p>
</div>
{% endblock %}
